# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "polytalk-agent"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chacha20poly1305 = "=0.10.1"
argon2 = "=0.5.3"
getrandom = "=0.3.4"
zeroize = "=1.9.1"

matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "bundled-sqlite", "rustls-aws-lc-rs"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "signal", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }

tracing = "=0.1.44"

[dev-dependencies]
tempfile = "=3.27.0"
