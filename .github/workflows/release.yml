# SPDX-License-Identifier: GPL-3.0-or-later
name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: Validate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json');if(process.env.RELEASE_TAG!=='v'+p.version)process.exit(1)"
      - run: node scripts/export-public.mjs
      - name: Archive curated sources
        run: tar -czf polytalk-source.tar.gz -C .local/public-export .
      - name: Create draft, never claim production qualification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" polytalk-source.tar.gz --draft --prerelease --verify-tag --generate-notes
