# SPDX-License-Identifier: GPL-3.0-or-later
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 2'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311
