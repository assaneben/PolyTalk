# SPDX-License-Identifier: GPL-3.0-or-later
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 2'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311
